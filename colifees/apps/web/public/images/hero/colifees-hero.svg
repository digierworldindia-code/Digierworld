<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="A COLIFEES mattress in a calm, softly lit bedroom">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/><stop offset="1" stop-color="#e6ddcf"/>
    </linearGradient>
    <linearGradient id="light" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#room)"/>
  <rect width="1600" height="1100" fill="url(#light)"/>
  <!-- window light -->
  <g opacity="0.5">
    <rect x="980" y="90" width="330" height="420" rx="10" fill="#ffffff" opacity="0.75"/>
    <path d="M1145 90v420M980 300h330" stroke="#e0d8cb" stroke-width="10"/>
  </g>
  <!-- headboard -->
  <rect x="250" y="330" width="1100" height="200" rx="26" fill="#d9cdb9"/>
  <!-- mattress -->
  <rect x="210" y="520" width="1180" height="170" rx="40" fill="#fdfbf7"/>
  <rect x="210" y="606" width="1180" height="84" rx="34" fill="#f1e9dc"/>
  <path d="M260 563h1080" stroke="#e5dbcb" stroke-width="5" fill="none"/>
  <!-- base -->
  <rect x="240" y="690" width="1120" height="120" rx="18" fill="#8a6a3d" opacity="0.88"/>
  <!-- pillows -->
  <rect x="330" y="450" width="330" height="110" rx="46" fill="#ffffff"/>
  <rect x="700" y="450" width="330" height="110" rx="46" fill="#ffffff"/>
  <!-- throw -->
  <rect x="210" y="640" width="1180" height="60" rx="24" fill="#c8a878" opacity="0.5"/>
  <!-- floor shadow -->
  <ellipse cx="800" cy="850" rx="620" ry="42" fill="#16120e" opacity="0.07"/>
</svg>
