; QMS - PHP hardening for the web (FPM) and CLI (cron) SAPIs. Installed by deploy/install.sh.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
allow_url_fopen = On          ; harmless without allow_url_include; some libraries read HTTPS URLs
allow_url_include = Off
file_uploads = On
max_file_uploads = 5
date.timezone = UTC           ; storage is UTC; the plant time zone is a system setting

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
realpath_cache_size = 4096K
